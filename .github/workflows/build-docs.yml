name: Build Docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # If your framework already outputs to docs/,
      # you can REMOVE this step
      - name: Copy build output to docs
        run: |
          rm -rf docs
          mkdir docs
          cp -r dist/* docs/

      - name: Commit docs
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add docs

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto-build docs"
            git push
          fi